name: Daily Job Scraper & Broadcast

on:
  schedule:
    # Runs 3 times daily: 8:30 AM, 2:30 PM, and 7:30 PM IST (03:00, 09:00, 14:00 UTC)
    - cron: '0 3,9,14 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Chrome environment
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Scraper & Content Generator
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
        CAREER_PORTAL_URL: ${{ secrets.CAREER_PORTAL_URL || 'https://formbharlo.in' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      run: |
        python scraper.py
        
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add latest_jobs.json archives/ || true
        git commit -m "Auto-update latest jobs and archives [skip ci]" || exit 0
        git push
